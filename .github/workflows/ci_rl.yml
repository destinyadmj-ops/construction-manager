name: RL CI and Shadow Run

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f tools/requirements-visualization.txt ]; then pip install -r tools/requirements-visualization.txt; fi

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run RL shadow-run
        run: python tools/rl_shadow_run.py

      - name: Visualize reward logs
        run: python tools/visualize_reward_logs.py

      - name: Upload logs and plots
        uses: actions/upload-artifact@v4
        with:
          name: rl-shadow-artifacts
          path: |
            logs/reward_shadow.log
            logs/plots
