name: Build (AWS Secrets Manager)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Fetch secret JSON from Secrets Manager
        id: getsecret
        run: |
          aws secretsmanager get-secret-value --secret-id my/app/prod --query SecretString --output text > secret.json
          echo "SECRET_JSON<<EOF" >> $GITHUB_OUTPUT
          cat secret.json
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create .env.production
        run: |
          jq -r '.DATABASE_URL' secret.json | xargs -I{} echo "DATABASE_URL='{}'" > .env.production
          jq -r '.REDIS_URL' secret.json | xargs -I{} echo "REDIS_URL='{}'" >> .env.production
          jq -r '.NEXT_PUBLIC_APP_NAME' secret.json | xargs -I{} echo "NEXT_PUBLIC_APP_NAME='{}'" >> .env.production

      - name: Install and Build
        run: npm ci && npm run build
