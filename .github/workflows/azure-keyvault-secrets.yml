name: Build (Azure Key Vault)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch secrets from Azure Key Vault
        id: keyvault
        uses: azure/keyvault-secrets@v1
        with:
          keyvault: ${{ secrets.AZURE_KEYVAULT_NAME }}
          secrets: DATABASE_URL,REDIS_URL,NEXT_PUBLIC_APP_NAME,ACCOUNTING_PROVIDER

      - name: Create .env.production
        run: |
          echo "NODE_ENV=production" > .env.production
          echo "PORT=3001" >> .env.production
          echo "DATABASE_URL='${{ steps.keyvault.outputs.DATABASE_URL }}'" >> .env.production
          echo "REDIS_URL='${{ steps.keyvault.outputs.REDIS_URL }}'" >> .env.production
          echo "NEXT_PUBLIC_APP_NAME='${{ steps.keyvault.outputs.NEXT_PUBLIC_APP_NAME }}'" >> .env.production
          echo "ACCOUNTING_PROVIDER='${{ steps.keyvault.outputs.ACCOUNTING_PROVIDER }}'" >> .env.production

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
