name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.PROD_ALERT_WEBHOOK_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
      NEXTAUTH_SECRET: ${{ secrets.PROD_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.PROD_NEXTAUTH_URL }}
      ADMIN_TOKEN: ${{ secrets.PROD_ADMIN_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate deploy secrets
        run: |
          required_vars=(DATABASE_URL DIRECT_URL NEXTAUTH_SECRET NEXTAUTH_URL DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY)
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "Missing required secret: ${var_name}" >&2
              exit 1
            fi
          done

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: GITHUB_SHA,GITHUB_REPOSITORY,DEPLOY_PATH,DATABASE_URL,DIRECT_URL,REDIS_URL,NEXTAUTH_SECRET,NEXTAUTH_URL,ADMIN_TOKEN
          script: |
            set -eu

            run_compose() {
              docker compose -f docker-compose.prod.yml --env-file .env.production "$@"
            }

            check_ready() {
              local attempt=1
              local max_attempts=12
              local body_file

              while [ "$attempt" -le "$max_attempts" ]; do
                body_file="$(mktemp)"

                if curl --fail --silent --show-error --max-time 10 \
                  --output "$body_file" \
                  http://127.0.0.1:3000/api/health?probe=ready; then
                  cat "$body_file"
                  rm -f "$body_file"
                  return 0
                fi

                echo "Readiness attempt ${attempt}/${max_attempts} failed." >&2
                cat "$body_file" >&2 || true
                rm -f "$body_file"

                if [ "$attempt" -lt "$max_attempts" ]; then
                  sleep 5
                fi

                attempt=$((attempt + 1))
              done

              return 1
            }

            mkdir -p "$DEPLOY_PATH"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH"
            previous_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            git fetch origin main --prune
            git checkout -B main origin/main
            git reset --hard "$GITHUB_SHA"
            desktop_env_lines=""
            if [ -f .env.production ]; then
              desktop_env_lines="$(grep '^DESKTOP_APP_' .env.production || true)"
            fi
            redis_url="${REDIS_URL:-redis://redis:6379}"
            cat > .env.production <<EOF
            DATABASE_URL=${DATABASE_URL}
            DIRECT_URL=${DIRECT_URL}
            REDIS_URL=${redis_url}
            MASTER_HUB_STORAGE_DIR=/data/masterhub-storage
            PRINT_OUTBOX_DIR=/data/masterhub-outbox/print
            FAX_OUTBOX_DIR=/data/masterhub-outbox/fax
            NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
            NEXTAUTH_URL=${NEXTAUTH_URL}
            ADMIN_TOKEN=${ADMIN_TOKEN}
            EOF
            if [ -n "$desktop_env_lines" ]; then
              printf '\n%s\n' "$desktop_env_lines" >> .env.production
            fi
            run_compose up -d --build --remove-orphans

            if ! check_ready; then
              echo "Deploy readiness check failed." >&2
              run_compose ps >&2 || true
              run_compose logs --tail=120 >&2 || true

              if [ -n "$previous_sha" ] && [ "$previous_sha" != "$GITHUB_SHA" ]; then
                echo "Rolling back to previous commit: $previous_sha" >&2
                git reset --hard "$previous_sha"
                run_compose up -d --build --remove-orphans

                if ! check_ready; then
                  echo "Rollback readiness check also failed." >&2
                  run_compose ps >&2 || true
                  run_compose logs --tail=120 >&2 || true
                fi
              fi

              exit 1
            fi

      - name: Notify deploy failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          payload=$(cat <<EOF
          {"text":"[master-hub] Deploy to Production failed for ${COMMIT_SHA}. ${RUN_URL}"}
          EOF
          )

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$ALERT_WEBHOOK_URL"
