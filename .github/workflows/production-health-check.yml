name: Production Health Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.PROD_ALERT_WEBHOOK_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            url: https://masterhubapp.org
            expect_fragment: ""
          - name: www
            url: https://www.masterhubapp.org
            expect_fragment: ""
          - name: api-health
            url: https://masterhubapp.org/api/health?probe=ready
            expect_fragment: '"ok":true'

    steps:
      - name: Check ${{ matrix.name }}
        env:
          TARGET_URL: ${{ matrix.url }}
          EXPECT_FRAGMENT: ${{ matrix.expect_fragment }}
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          status_code="$(curl --silent --show-error --location --max-time 20 \
            --output "$body_file" \
            --write-out "%{http_code}" \
            "$TARGET_URL")"

          echo "Checked: $TARGET_URL"
          echo "HTTP status: $status_code"

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 400 ]; then
            echo "Unexpected status code for $TARGET_URL: $status_code" >&2
            cat "$body_file"
            exit 1
          fi

          if [ -n "$EXPECT_FRAGMENT" ]; then
            if ! grep -F "$EXPECT_FRAGMENT" "$body_file" > /dev/null; then
              echo "Expected response fragment not found: $EXPECT_FRAGMENT" >&2
              cat "$body_file"
              exit 1
            fi
          fi

      - name: Notify health-check failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        env:
          TARGET_URL: ${{ matrix.url }}
          TARGET_NAME: ${{ matrix.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          payload=$(cat <<EOF
          {"text":"[master-hub] Production health check failed: ${TARGET_NAME} ${TARGET_URL} ${RUN_URL}"}
          EOF
          )

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$ALERT_WEBHOOK_URL"
