services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file:
      - ./.env.production
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - ./.env.production
    restart: unless-stopped
