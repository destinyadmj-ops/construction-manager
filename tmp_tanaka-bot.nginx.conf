server {
    server_name tanaka-bot.org;

    location /healthz {
        proxy_pass http://127.0.0.1:5001/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhook {
        proxy_pass http://127.0.0.1:5001/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /learning-summary {
        proxy_pass http://127.0.0.1:5001/learning-summary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /monitor {
        proxy_pass http://127.0.0.1:5001/monitor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tanaka-bot.org-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tanaka-bot.org-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = tanaka-bot.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name tanaka-bot.org;
    return 404; # managed by Certbot
}
